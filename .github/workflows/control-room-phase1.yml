name: Control Room Phase 1 Validation

on:
  push:
    branches:
      - feature/control-room-ui
  pull_request:
    branches:
      - feature/control-room-ui

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm from packageManager
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Runtime session regression
        run: pnpm exec vitest run server/closedLoopRuntimeStore.test.ts
